# CANDIDATO OPTUNA (no oficial) · v2 · recompensa = retorno log − penalización por aumento del drawdown
#   Mejor trial de Optuna (validación 2016). Solo para comparar con semillas contra el YAML oficial;
#   no se usa en la corrida oficial salvo que se adopte y se registre en docs/decisiones.md.
#
# Entrena en 2009-2015 (episodios de 252 días con inicio aleatorio) y, al final,
# evalúa en 2016 (validación). El held-out 2017-2018 NO aparece aquí: solo se usa
# en el notebook, una vez, después de fijar todo.

experiment: agente-inversor
env: Investor-log_dd-v0
eval_env: Investor-log_dd-val-v0
algo: dqn
timesteps: 150_000
eval_episodes: 1          # la política greedy es determinista: 1 episodio basta

hyperparams:
  learning_rate: 1.48e-4          # Optuna trial 3 (YAML: 1.0e-4)
  buffer_size: 50_000
  learning_starts: 2_000
  batch_size: 64
  gamma: 0.9                       # Optuna trial 3 (YAML: 0.99)
  train_freq: 4
  target_update_interval: 1_000
  exploration_fraction: 0.337      # Optuna trial 3 (YAML: 0.3)
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  policy_kwargs: {net_arch: [64, 64]}
  seed: 42
  device: cpu                   # MLP pequeña: la CPU es más rápida que la GPU

tune:
  trials: 15
  timesteps: 50_000             # por trial
  search_space:
    learning_rate: {type: float, low: 3.0e-5, high: 1.0e-3, log: true}
    gamma: {type: categorical, choices: [0.9, 0.95, 0.99]}
    exploration_fraction: {type: float, low: 0.1, high: 0.5}
    batch_size: {type: categorical, choices: [32, 64, 128]}
